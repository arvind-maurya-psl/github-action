name: Build and Deploy Spring Boot to ECS

on:
  push:
    branches:
      - main
      - develop
      - develop-aws

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Maven Project
        run: mvn clean package -DskipTests

      - name: Debug OIDC sub claim
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo $TOKEN | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4; if(l==2)$0=$0"=="; else if(l==3)$0=$0"="; print $0}' | base64 -d 2>/dev/null || echo '{}')
          echo "sub:              $(echo $PAYLOAD | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("sub","<missing>"))')"
          echo "iss:              $(echo $PAYLOAD | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("iss","<missing>"))')"
          echo "job_workflow_ref: $(echo $PAYLOAD | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("job_workflow_ref","<missing>"))')"
          echo "repository:       $(echo $PAYLOAD | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("repository","<missing>"))')"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 1.0.${{ github.run_number }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

